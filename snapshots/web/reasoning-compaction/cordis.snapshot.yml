# Keyless reasoning-effort compaction preset without platform-specific tools.
- insert:
    - id: preset-reasoning-compaction
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: reasoning-compaction
        name: Reasoning compaction
        order: 4
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a helpful software engineer assistant.
              complete: true
              includeRuntimeContext: false
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: false
              readImage: true
              write: false
              edit: false
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                  auto: false
                  maxTokens: 32
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
